name: Deploy Firebase billing backend

on:
  push:
    branches: ["main"]
    paths:
      - "firebase.json"
      - "firestore.rules"
      - "functions/**"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Check function syntax
        run: node --check functions/index.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy functions and Firestore rules
        run: npx --yes firebase-tools deploy --only functions,firestore:rules --project graphite-poetry-xxq1s --non-interactive
